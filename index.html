      const left = date === T ? M.left - amt : null;
      toast(`Logged ${eur(amt)} · <b>+5 XP</b>${left != null ? (left >= 0 ? ` · ${eur(left, 0)} left today` : ` · over by ${eur(-left, 0)}`) : ''}`);
    });
  },
  earn(f, fd) {
    const amt = num(fd.get('amt')); if (!(amt > 0)) return fail('Type how much came in.');
    const cur = fd.get('cur'), date = fd.get('date') || T, src = fd.get('src'), note = (fd.get('note') || '').trim();
    const eurV = cur === 'USD' ? amt * rate() : amt;
    const p = date > T
      ? store.set('items/' + uid(), {name: note || src, amt: r2(amt), cur, acct: fd.get('acct'), income: true, cat: 'Income', freq: 'once', start: date, day: +date.slice(8), count: null, note: src + ' (expected)', order: 3})
      : store.add('txns', {kind: 'inc', date, eur: r2(eurV), orig: r2(amt), cur, acct: fd.get('acct'), src, note, at: Date.now()});
    save(p).then(() => { closeSheet(); toast(date > T ? `Expected ${cur === 'USD' ? usd(amt) : eur(amt)} on ${fmtD(date)}` : `Loot! ${cur === 'USD' ? usd(amt, 2) : eur(amt)} · <b>+5 XP</b>`); });
  },
  move(f, fd) {
    const amt = num(fd.get('amt')); if (!(amt > 0)) return fail('Type how much you moved.');
    if (fd.get('acct') === fd.get('to')) return fail('Pick two different accounts.');
    save(store.add('txns', {kind: 'xfer', date: fd.get('date') || T, eur: r2(amt), orig: r2(amt), cur: 'EUR', acct: fd.get('acct'), to: fd.get('to'), at: Date.now()}))
      .then(() => { closeSheet(); toast(`Moved ${eur(amt)} to ${acctName(fd.get('to'))} · <b>+5 XP</b>`); });
  },
  plan(f, fd) {
    const amt = num(fd.get('amt')), name = (fd.get('name') || '').trim(), date = fd.get('date');
    if (!name) return fail('Give it a name.'); if (!(amt > 0)) return fail('Type the amount.'); if (!date) return fail('Pick the due date.');
    save(store.set('items/' + uid(), {name, amt: r2(amt), cur: 'EUR', acct: fd.get('acct'), cat: fd.get('cat'), biz: !!fd.get('biz'), freq: 'once', start: date, day: +date.slice(8), count: null, order: 200, addedOn: T}))
      .then(() => { closeSheet(); toast(`${esc(name)} added for ${fmtD(date)}`); });
  },
  later(f, fd) {
    const amt = num(fd.get('amt')), name = (fd.get('name') || '').trim(), date = fd.get('date'), count = parseInt(fd.get('count'), 10);
    if (!name) return fail('What did you buy?'); if (!(amt > 0)) return fail('Type the amount of each payment.'); if (!(count > 0)) return fail('How many payments?'); if (!date) return fail('Pick the first payment date.');
    const acct = fd.get('acct'), kl = acct === 'klarna';
    save(store.set('items/' + uid(), {name, amt: r2(amt), cur: 'EUR', acct, cat: kl ? 'Klarna' : 'Debts', group: kl ? 'Klarna' : null, debt: true, freq: 'monthly', day: +date.slice(8), start: date, count, order: 39, addedOn: T}))
      .then(() => { closeSheet(); toast(`New boss: ${esc(name)} · ${eur(amt * count, 0)} HP`); });
  },
  sync(f, fd) {
    const balances = {}, acctSync = {}, now = Date.now();
    for (const a of accts()) {
      if (isLiveAcct(a.id)) continue;
      const v = num(fd.get('b_' + a.id)); if (isNaN(v)) return fail(`Check the number for ${a.name}.`);
      balances[a.id] = r2(v); acctSync[a.id] = {d: T, at: now, live: false};
    }
    const total = r2(sum(Object.values(Object.assign({}, S.balances || {}, balances))));
    const syncs = (S.syncs || []).slice(-90).concat({d: T, total});
    save(store.update('fin/settings', {balances, acctSync, syncDate: T, syncAt: now, syncs}), `Balances saved · <b>+25 XP</b>`).then(closeSheet);
  },
  item(f, fd) {
    const id = f.dataset.id, old = id ? ITEMS.find(i => i.id === id) : null;
    const name = (fd.get('name') || '').trim(), amt = num(fd.get('amt'));
    if (!name) return fail('Give it a name.'); if (!(amt > 0)) return fail('Type the amount.');
    const freq = fd.get('freq'), next = fd.get('next'), leftRaw = fd.get('left');
    if (!next) return fail('Pick a date.');
    const left = leftRaw === '' || leftRaw == null ? null : parseInt(leftRaw, 10);
    const income = fd.get('kind') === 'income';
    const data = Object.assign({}, old || {}, {
      name, amt: r2(amt), cur: fd.get('cur'), acct: fd.get('acct'), cat: income ? 'Income' : (fd.get('cat') === 'Income' ? 'Other bills' : fd.get('cat')),
      income, freq, every: freq === 'days' ? Math.max(1, parseInt(fd.get('every'), 10) || 3) : (old && old.every) || null,
      note: (fd.get('note') || '').trim(), match: (fd.get('match') || '').trim(), debt: !income && !!fd.get('debt'), biz: !!fd.get('biz'), paused: !!fd.get('paused'),
    });
    delete data.id;
    if (old && old.guess && !fd.get('guess')) data.guess = false;
    if (old && old.guess && fd.get('guess')) data.guess = true;
    const changed = !old || next !== fd.get('onext') || String(leftRaw) !== String(fd.get('oleft')) || freq !== old.freq;
    if (changed) {
      data.start = next; data.day = +next.slice(8); data.count = freq === 'once' ? null : left;
      if (old && old.guess && !fd.get('guess')) data.guess = false;
      else if (old && old.guess && next !== fd.get('onext')) data.guess = false;
    }
    const owedRaw = data.debt ? String(fd.get('owed') || '').trim() : '';
    const owed = owedRaw ? num(owedRaw) : NaN;
    if (owedRaw && !(owed > 0)) return fail('Check the total you still owe, or leave it empty.');
    const owedPath = owedRaw !== '' && (String(r2(owed)) !== String(fd.get('oowed')) || !old || r2(amt) !== r2(old.amt) || next !== fd.get('onext'));
    if (owedPath && freq !== 'once') {
      const keep = old && next === fd.get('onext');
      const idx = keep ? rawOcc(Object.assign({}, old, {count: null}), old.start, addD(next, -1)).length : 0;
      if (keep) { data.start = old.start; data.day = old.day; } else { data.start = next; data.day = +next.slice(8); }
      const n = Math.ceil(owed / amt - 1e-6), last = r2(owed - (n - 1) * amt);
      Object.assign(data, {count: idx + n, lastAmt: Math.abs(last - amt) < 0.005 ? null : last, owed: r2(owed), owedOn: T, paidOff: null});
      if (keep && r2(amt) !== r2(old.amt)) data.amtHist = histWith(old, next);
    } else if (old && !changed && r2(amt) !== r2(old.amt) && freq !== 'once') {
      data.amtHist = histWith(old, fd.get('onext') || T);
    } else if (changed && String(leftRaw) !== String(fd.get('oleft'))) data.lastAmt = null;
    if (!old) data.addedOn = T;
    if (!data.order) data.order = income ? 5 : 150;
    save(store.set('items/' + (id || uid()), data), id ? 'Saved' : `${esc(name)} added`).then(closeSheet);
  },
  occ(f, fd) {
    const key = f.dataset.key, o = findOcc(key); if (!o) return closeSheet();
    const amt = num(fd.get('amt')); if (isNaN(amt) || amt < 0) return fail('Type the amount.');
    const date = fd.get('date') || o.date, all = !!fd.get('all'), nowDone = !!fd.get('done');
    const ops = [];
    if (all && Math.abs(amt - o.base) >= 0.005) ops.push(store.update('items/' + o.it.id, {amt: r2(amt), amtHist: histWith(o.it, o.orig)}));
    const patch = {ov: {[key]: Object.assign({skip: null, date: null, amt: null}, MARKS.ov[key] || {}, {amt: all || Math.abs(amt - o.base) < 0.005 ? null : r2(amt), date: date === o.orig ? null : date})}};
    if (nowDone !== o.done) patch.done = {[key]: nowDone ? Date.now() : null};
    ops.push(store.update('fin/marks', patch));
    save(Promise.all(ops), nowDone && !o.done ? 'Saved · <b>+10 XP</b>' : 'Saved').then(closeSheet);
  },
  strike() {
    const s = strikeState(); if (!s) return;
    const {it, d, R, L, acct, mode} = s;
    if (!(R > 0)) return fail('Type what you still owe in total.');
    if (!(L > 0)) return fail('Type how much you are paying.');
    const hit = Math.min(L, R), plan = strikePlan(it, R, hit, mode), xp = Math.floor(hit / 10) + (plan.kill ? 150 : 0);
    save(Promise.all([
      store.update('items/' + it.id, plan.patch),
      store.add('txns', {kind: 'pay', date: T, eur: r2(hit), orig: r2(hit), cur: 'EUR', acct, debt: it.id, note: `Strike · ${debtName(it)}`, at: Date.now()}),
    ])).then(() => { closeSheet(); if (!plan.kill) confetti(); toast(plan.kill ? `Strike landed · <b>+${xp} XP</b>` : `Hit ${esc(debtName(it))} for ${eur(hit, 0)} · <b>+${xp} XP</b>`, 'big'); });
  },
  txn(f, fd) {
    const id = f.dataset.id, t = TXNS.find(x => x.id === id); if (!t) return;
    const amt = num(fd.get('amt')); if (!(amt > 0)) return fail('Type the amount.');
    const data = Object.assign({}, t, {date: fd.get('date') || t.date, acct: fd.get('acct')});
    delete data.id;
    if (t.kind === 'inc' && t.cur === 'USD') { data.orig = r2(amt); data.eur = r2(amt * rate()); } else { data.orig = r2(amt); data.eur = r2(amt); }
    if (t.kind !== 'xfer') data.note = (fd.get('note') || '').trim();
    if (t.kind === 'exp') data.cat = fd.get('cat');
    if (t.kind === 'inc') data.src = fd.get('src');
    if (t.kind === 'xfer') { data.to = fd.get('to'); if (data.to === data.acct) return fail('Pick two different accounts.'); }
    save(store.set('txns/' + id, data), 'Saved').then(closeSheet);
  },
  reveal(f, fd) {
    const it = ITEMS.find(i => i.id === f.dataset.id), owe = num(fd.get('amt'));
    if (!it) return; if (!(owe > 0)) return fail('Type what you still owe.');
    const ni = nextInfo(Object.assign({}, it, {count: null}));
    const count = Math.ceil(owe / it.amt - 0.001);
    save(store.update('items/' + it.id, {start: ni.next, day: +ni.next.slice(8), count, owed: r2(owe), owedOn: T}), `${esc(it.name)} has ${eur(owe, 0)} HP · ${count} hits to go`).then(closeSheet);
  },
  settings(f, fd) {
    const fxAuto = !!fd.get('fxauto');
    const fx = fxAuto ? +S.fx : num(fd.get('fx'), true), fee = num(fd.get('fee'), true), buffer = num(fd.get('buffer')), living = num(fd.get('living'));
    if (!(fx > 0)) return fail('Check the exchange rate.');
    const accounts = accts().map(a => ({id: a.id, name: (fd.get('an_' + a.id) || a.name).trim() || a.name}));
    save(store.update('fin/settings', {name: String(fd.get('name') || '').trim().slice(0, 30), fx, fxAuto, fee: isNaN(fee) ? 0 : fee, buffer: isNaN(buffer) ? 0 : buffer, living: isNaN(living) ? 0 : living, horizon: +fd.get('horizon') || 42, accounts}), 'Settings saved').then(() => { closeSheet(); if (fxAuto && S.fxDate !== T) refreshFx(true); });
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(f, new FormData(f));
});
document.addEventListener('change', e => {
  if (e.target.id === 'r-file' && e.target.files && e.target.files[0]) {
    e.target.files[0].text().then(t => { $('#s-import').value = t; ACTIONS.import(); }, () => fail('Could not read that file.'));
  }
  if (e.target.name === 'freq') { const w = $('#i-every-wrap'); if (w) w.hidden = e.target.value !== 'days'; }
  if (e.target.id === 'i-debt' || (e.target.name === 'kind' && $('#i-owed-wrap'))) { const f = e.target.form; $('#i-owed-wrap').hidden = !(f.debt.checked && f.querySelector('[name=kind]:checked').value !== 'income'); }
  if (e.target.name === 'theme') setTheme(e.target.value);
  if (e.target.id === 's-fxauto') { const i = $('#s-fx'); if (i) i.readOnly = e.target.checked; }
  if (e.target.name === 'simmode') { simMode = e.target.value; simExtra = simMode === 'once' ? 1000 : 100; const bx = $('#simbox'); if (bx) bx.outerHTML = simBlock(); }
  if (e.target.id === 'sim-target') { simTarget = e.target.value; $('#sim-out').innerHTML = simOut(); }
  if (e.target.id === 'sim-roll') { simRoll = e.target.checked; $('#sim-out').innerHTML = simOut(); }
  if (e.target.closest('form[data-form="strike"]')) strikePreview();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q-search') { searchQ = e.target.value; $('#q-out').innerHTML = searchOut(searchQ); }
  if (e.target.id === 'eb-q') ebList();
  if (e.target.id === 'sim-extra') { simExtra = +e.target.value; $('#sim-val').textContent = eur(simExtra, 0); $('#sim-usd').textContent = '≈ ' + usd(simExtra / rate()); $('#sim-out').innerHTML = simOut(); }
  if (e.target.closest('form[data-form="strike"]')) strikePreview();
  if (['i-owed', 'i-amt', 'i-next'].includes(e.target.id) && $('#i-owed-prev')) owedPreview();
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if ($('#qa-val') && !$('#sheet').hidden && !e.metaKey && !e.ctrlKey && !(e.target.matches && e.target.matches('input[type=text], input[type=date], input[type=search], textarea, select'))) {
    const k = e.key === '.' ? ',' : e.key === 'Backspace' ? 'del' : e.key;
    if (/^[0-9,]$/.test(k) || k === 'del') { e.preventDefault(); pressKey(k); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex]:not(button)')) { e.preventDefault(); e.target.click(); }
});
function owedPreview() {
  const f = $('form[data-form="item"]'), el = $('#i-owed-prev'); if (!f || !el) return;
  const owed = num(f.owed.value), amt = num(f.amt.value), next = f.next.value;
  if (!(owed > 0) || !(amt > 0) || !next) { el.textContent = 'Type the total and the amount you want to pay each time. I\'ll work out how many payments are left.'; return; }
  const n = Math.ceil(owed / amt - 1e-6), last = r2(owed - (n - 1) * amt);
  const freq = (f.querySelector('[name=freq]:checked') || {}).value || 'monthly';
  const lastD = rawOcc({freq, start: next, day: +next.slice(8), every: +f.every.value || 3, count: n}, next, '9999-12-31').slice(-1)[0];
  el.innerHTML = `<b>${n} payment${n > 1 ? 's' : ''}</b>${Math.abs(last - amt) >= 0.005 ? ` (${n - 1} × ${eur(amt)} and a last one of ${eur(last)})` : ` of ${eur(amt)}`}. Last one ${lastD ? fmtD(lastD) : '—'}.`;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (cloudDirtyAt && cloudOn()) cloudUpload(false); return; }
  checkUpdate();
  if (S) { hello(); ebReturned(); }
  if (cloudOn() && !cloudGate && Date.now() - cloudLastCheck > 60000) cloudGate = cloudCheck().finally(() => { cloudGate = null; });
  if (isoOf(new Date()) !== T) scheduleRender();
  if (liveOn() && Date.now() - (S.live.lastAt || 0) > 3 * 60000) liveSync(true).then(r => liveToast(r, true));
});
setInterval(() => { if (!document.hidden && liveOn()) liveSync(false).then(r => liveToast(r, true)); }, 5 * 60000);

/* ---------- pull down to refresh ----------
   At the top of the page, pull down: past the line, let go (or hold a moment) and it syncs with your banks, your other
   devices and the exchange rate, like most phone apps. */
const PTR_LINE = 72;
let ptr = null, ptrBusy = false;
function ptrShow(d, text, mode) {
  const el = $('#ptr'); if (!el) return;
  el.classList.toggle('on', d > 6 || mode === 'spin');
  el.classList.toggle('ready', mode === 'ready');
  el.classList.toggle('spin', mode === 'spin');
  el.style.transform = `translate(-50%, ${Math.round(Math.min(d, PTR_LINE + 16) - 80)}px)`;
  if (text) $('#ptr-t').textContent = text;
}
function ptrReset() { if (ptr) clearTimeout(ptr.timer); ptr = null; if (!ptrBusy) ptrShow(0, '', ''); }
async function refreshAll() {
  checkUpdate();
  if (cloudOn() && !cloudGate) { cloudGate = cloudCheck().finally(() => { cloudGate = null; }); await cloudGate; }
  T = isoOf(new Date());
  if (liveOn() && !liveBusy) { const r = await liveSync(true); liveToast(r, false); }
  else if (!liveOn()) toast('Up to date');
  if (S && S.fxAuto !== false) refreshFx(false);
  scheduleRender();
}
async function ptrGo() {
  if (!ptr || ptrBusy) return;
  clearTimeout(ptr.timer); ptr = null; ptrBusy = true;
  ptrShow(PTR_LINE, 'Syncing…', 'spin');
  try { await refreshAll(); } catch (e) { console.warn('refresh', e); }
  finally { ptrBusy = false; ptrShow(0, '', ''); }
}
document.addEventListener('touchstart', e => {
  if (ptrBusy || !S || e.touches.length !== 1 || window.scrollY > 0 || !$('#sheet').hidden) return;
  ptr = {y0: e.touches[0].clientY, x0: e.touches[0].clientX, d: 0, ready: false, timer: null};
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!ptr || e.touches.length !== 1) return;
  const dy = e.touches[0].clientY - ptr.y0, dx = Math.abs(e.touches[0].clientX - ptr.x0);
  if (dy <= 0 || (dy < 12 && dx > dy) || window.scrollY > 4) { ptrReset(); return; } // scrolling, or swiping sideways
  ptr.d = dy * 0.55; // a little resistance, like a native pull
  const ready = ptr.d >= PTR_LINE;
  if (ready && !ptr.ready) { ptr.ready = true; ptr.timer = setTimeout(ptrGo, 450); } // held past the line: go
  if (!ready && ptr.ready) { ptr.ready = false; clearTimeout(ptr.timer); }
  ptrShow(ptr.d, ready ? 'Release to sync' : 'Pull to sync', ready ? 'ready' : '');
}, {passive: true});
document.addEventListener('touchend', () => { if (ptr && ptr.ready) ptrGo(); else ptrReset(); }, {passive: true});
document.addEventListener('touchcancel', ptrReset, {passive: true});

/* ---------- boot ---------- */
async function boot() {
  const h = (location.hash || '').slice(1);
  if (VIEWS.some(v => v[0] === h)) view = h;
  render();
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { console.warn(e); }
  }
  if (user) { try { locked = !(await user.isOwner()); } catch (e) {} }
  if (locked) { Object.keys(got).forEach(k => { got[k] = true; }); render(); return; }
  store = db ? dbStore(db) : localStore();
  if (store.kind === 'local') {
    window.__debtSlayer = {importAll, exportAll};
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
  }
  attach();
  setTimeout(() => { if (!allGot()) { slow = true; scheduleRender(); } }, 10000);
  setTimeout(checkUpdate, 4000);
}
/* keep the in-memory board in step with the store */
function attach() {
  const err = e => { console.warn('db', e); if (e && e.code === 'revoked') locked = true; Object.keys(got).forEach(k => { got[k] = true; }); scheduleRender(); };
  store.watchDoc('fin/settings', d => { S = d; got.s = true; scheduleRender(); }, err);
  store.watchDoc('fin/marks', d => { MARKS = {done: (d && d.done) || {}, ov: (d && d.ov) || {}, via: (d && d.via) || {}}; got.m = true; scheduleRender(); }, err);
  store.watchDoc('fin/days', d => { DAYS = {d: (d && d.d) || {}}; got.d = true; scheduleRender(); }, err);
  store.watchColl('items', list => { ITEMS = list; got.i = true; scheduleRender(); }, err);
  store.watchColl('txns', list => { TXNS = list; got.t = true; scheduleRender(); }, err);
  store.watchDoc('fin/live', d => { LIVE = {seen: (d && d.seen) || {}}; }, err);
  if (store.onChange) store.onChange(cloudChanged); // back up changes (this browser's store only)
}

/* ---------- tests and QA: test/harness.js runs this file with no page and drives the engine through API ---------- */
const API = {
  state: () => ({S, ITEMS, TXNS, MARKS, DAYS, LIVE, T, M}),
  setToday: d => { T = d; },
  useLocalStore: () => { store = localStore(); attach(); return store; },
  compute, occ, rawOcc, project, monthStats, debtOf, bosses, simulate, progress, unlocks,
  matchName, matchWords, buildPlan, guessCat, guessSrc, applyFeed, num, exportAll, importAll, unmatchBill, bankId, dayLimit, dayOk, liveAlert, setLiveErr: e => { liveErr = e; },
  refreshAll, untracked, ebBlock, setEb: d => { EB = {at: Date.now(), data: d, busy: false}; }, nextOn, setupBoard, setSetup: v => { SETUP = v; }, addRecurring, setRecurring: items => { RECUR = {at: Date.now(), items, busy: false}; },
  cloud: {seal, unseal, newLockKey, keyForEnvelope, boardHash, upload: cloudUpload, check: cloudCheck, load: cloudLoad, conf: cloudConf, device,
    state: () => ({cloudErr, cloudPending, cloudDirtyAt, cloudTimer: !!cloudTimer}), store: () => store},
};
if (window.__dsTest) { headless = true; window.__dsTest(API); }
else { if (window.__dsQA) window.__qa = API; boot(); }
})();
