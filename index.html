<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ds-version" content="ds-1af15d80f6">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Debt Slayer: a game-style money planner. Daily spending limit, bills, and a debt payoff plan.">
<meta name="theme-color" content="#F3EEFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130D27" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debt Slayer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=localStorage.getItem('debtslayer.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Debt Slayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: Coach. Sticky top bar, one view at a time, chunky rounded cards with ink outlines and hard shadows, bottom tab bar on phones, two columns on desktop */
:root{
  --bg:#F3EEFF; --panel:#FFFFFF; --panel-2:#F7F3FF; --ink:#1C1238; --muted:#5B5180; --edge:#1C1238; --rule:#E2D9FA; --scrim:rgba(28,18,56,.5);
  --gold:#6D3AED; --gold-ink:#FFFFFF; --gold-soft:#EDE5FF;
  --lime:#C6F432; --lime-soft:#E9FFC2; --on-lime:#1C1238;
  --coin:#FFC531; --coral:#FF6B4A; --coral-soft:#FFE4DC; --sky-soft:#DCEEFF;
  --loot:#0E7C55; --loot-soft:#E9FFC2;
  --hit:#C8361A; --hit-soft:#FFE4DC;
  --boss:#5B21D6; --boss-soft:#EDE5FF;
  --warn:#9A5800; --warn-soft:#FFF1CC;
  --f-hud:"Bricolage Grotesque", "Nunito", system-ui, sans-serif;
  --f-ui:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"Bricolage Grotesque", "Nunito", system-ui, sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130D27; --panel:#1F1840; --panel-2:#2A2152; --ink:#F4F0FF; --muted:#B9AEE0; --edge:#05030D; --rule:#3A2F6B; --scrim:rgba(0,0,0,.62);
    --gold:#7C3AED; --gold-ink:#FFFFFF; --gold-soft:#2F2363;
    --lime:#C6F432; --lime-soft:#26340E; --on-lime:#1C1238;
    --coin:#FFC531; --coral:#FF7A5C; --coral-soft:#43201A; --sky-soft:#152C47;
    --loot:#86E3AE; --loot-soft:#1D3A26;
    --hit:#FF8A70; --hit-soft:#43201A;
    --boss:#B79CFF; --boss-soft:#2F2363;
    --warn:#FFC163; --warn-soft:#3D2E0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130D27; --panel:#1F1840; --panel-2:#2A2152; --ink:#F4F0FF; --muted:#B9AEE0; --edge:#05030D; --rule:#3A2F6B; --scrim:rgba(0,0,0,.62);
  --gold:#7C3AED; --gold-ink:#FFFFFF; --gold-soft:#2F2363;
  --lime:#C6F432; --lime-soft:#26340E; --on-lime:#1C1238;
  --coin:#FFC531; --coral:#FF7A5C; --coral-soft:#43201A; --sky-soft:#152C47;
  --loot:#86E3AE; --loot-soft:#1D3A26;
  --hit:#FF8A70; --hit-soft:#43201A;
  --boss:#B79CFF; --boss-soft:#2F2363;
  --warn:#FFC163; --warn-soft:#3D2E0E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h2{font:800 19px/1.2 var(--f-hud)}
h3{font:800 21px/1.2 var(--f-hud)}
p{margin:0}
a{color:var(--boss);font-weight:800;text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--boss);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hud{font-family:var(--f-hud)}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font:800 11px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:10px}
.px{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-4px}
.good{color:var(--loot)} .bad{color:var(--hit)} .warnc{color:var(--warn)}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
@media (max-width:420px){.top .wrap{gap:7px}.top .iconbtn{width:38px;height:38px}}
@media (max-width:400px){.top .brand{font-size:17px;gap:6px}.top .wrap{gap:6px}}
@media (max-width:369px){.top .brand .bt{display:none}}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mlist li{display:grid;gap:8px;padding:12px;border:2px solid var(--edge);border-radius:18px;background:var(--panel)}
.mlist small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sres h3{font:800 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sres .group{margin:0}
.addprev{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:6px 0;border:2px dashed var(--edge);border-radius:16px;font-size:13px;background:var(--panel-2)}
.brand{display:flex;align-items:center;gap:9px;font:800 21px/1 var(--f-hud);letter-spacing:-.01em;white-space:nowrap}
.brand .penny{width:30px;height:30px}
.spacer{flex:1}
.lvchip{display:flex;align-items:center;gap:6px;font:800 14px/1 var(--f-ui);padding:8px 11px;border:2px solid var(--edge);border-radius:999px;background:var(--panel);color:var(--ink);white-space:nowrap;cursor:pointer;box-shadow:0 2px 0 var(--edge)}
.lvchip .px{color:var(--gold);width:16px;height:16px}
.iconbtn{display:grid;place-items:center;width:42px;height:42px;border:2px solid var(--edge);border-radius:14px;background:var(--panel);box-shadow:0 2px 0 var(--edge);cursor:pointer;color:var(--ink)}
.iconbtn .px{width:20px;height:20px}
.iconbtn:active{transform:translateY(2px);box-shadow:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--edge);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:7px 2px;border-radius:14px;font:800 11px/1 var(--f-ui);color:var(--muted);cursor:pointer}
nav.tabs button .px{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--boss);background:var(--gold-soft)}
nav.tabs .navlog{background:var(--gold);color:var(--gold-ink);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);margin-top:-18px;border-radius:18px}
nav.tabs .navlog .px{width:24px;height:24px;stroke-width:3}
nav.tabs .navlog:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
@media (max-width:899px){button.fab{display:none}}
main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  nav.tabs{position:static;border:0;background:none;display:flex;gap:4px;padding:0}
  nav.tabs button{flex-direction:row;font-size:14px;padding:9px 12px;gap:8px}
  nav.tabs button .px{width:18px;height:18px}
  nav.tabs .navlog{display:none}
  main{padding-block:24px 96px}
}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:14px 20px;border:2px solid var(--edge);border-radius:18px;background:var(--gold);color:var(--gold-ink);font:800 17px/1 var(--f-ui);box-shadow:0 4px 0 var(--edge);cursor:pointer}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.fab .px{width:18px;height:18px;stroke-width:3}
@media (min-width:900px){.fab{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}

.pn{background:var(--panel);border:2px solid var(--edge);border-radius:var(--r);box-shadow:0 4px 0 var(--edge);padding:16px;min-width:0}
.sec{display:grid;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 14px/1 var(--f-ui);border:2px solid var(--edge);border-radius:14px;background:var(--panel);color:var(--ink);padding:11px 15px;min-height:44px;box-shadow:0 3px 0 var(--edge);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:0 3px 0 var(--edge)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.sm{padding:8px 11px;min-height:36px;font-size:13px;border-radius:12px;box-shadow:0 2px 0 var(--edge)}
.btn.wide{width:100%;padding:15px;font-size:16px}
.btn.danger{color:var(--hit)}
.btn.wrap{white-space:normal;text-align:center}
.btn.ghost{border-color:transparent;box-shadow:none;background:none;padding-inline:6px;color:var(--boss)}
.btn .px{stroke-width:2.6}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font:800 12px/1 var(--f-ui);border:2px solid var(--edge);white-space:nowrap;color:var(--on-lime)}
.pill.ok{background:var(--lime)}
.pill.tight{background:#FFD166}
.pill.short{background:var(--coral);color:#1C1238}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font:800 11px/1.3 var(--f-ui);background:var(--panel-2);color:var(--muted);border:1.5px solid var(--rule);white-space:nowrap}
.tag.biz{color:var(--boss);border-color:var(--boss-soft);background:var(--boss-soft)}
.tag.debt{color:var(--hit);border-color:var(--hit-soft);background:var(--hit-soft)}
.tag.guess{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft)}

/* bars */
.hp{height:16px;border:2px solid var(--edge);border-radius:999px;background:var(--panel-2);overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .5s ease}
.hp.sm{height:11px;border-width:1.5px}
.hp.gold i{background:var(--gold)} .hp.purple i{background:var(--coral)} .hp.hit i{background:var(--coral)} .hp.warn i{background:#FFB020}

/* HQ */
.hq{display:grid;gap:18px}
.hq .col{display:grid;gap:18px;align-content:start;min-width:0}
@media (min-width:900px){.hq{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.greet h1{font:800 30px/1.05 var(--f-hud);letter-spacing:-.01em}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bx{position:relative;display:grid;gap:4px;align-content:start;text-align:left;padding:14px;background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:22px;min-width:0;font:inherit;text-decoration:none}
button.bx,a.bx{cursor:pointer;box-shadow:0 3px 0 var(--edge)}
button.bx:active,a.bx:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
a.bx:hover{text-decoration:none}
.bx.wide{grid-column:span 2}
.bx .val{font:800 25px/1.05 var(--f-num);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bx .sub{font:700 13px/1.3 var(--f-ui);color:var(--muted)}
.bx .bxi{width:28px;height:28px}
.bx.spend{background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 var(--edge);padding:18px;gap:8px}
.bx.spend .lbl,.bx.spend .hp-meta{color:inherit;opacity:.92}
.bx.spend .big{font:800 clamp(52px,15vw,78px)/.95 var(--f-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bx.spend .explain{color:inherit;opacity:.94;font-size:13px;font-weight:600}
.bx.spend .explain b{color:inherit;font-weight:800}
.bx.spend .hp{background:rgba(0,0,0,.28)}
.bx.spend.over .big{color:#FFD5CC}
.bx.streak{background:var(--coral-soft)} .bx.streak .bxi{color:var(--coral)}
.bx.debt{background:var(--lime-soft);display:flex;align-items:center;gap:14px}
.bx.money{background:var(--panel)}
.bx.payday{background:var(--sky-soft)}
.bx.level{display:flex;align-items:center;gap:12px}
.bx.level .avatar{width:48px;height:48px}
.bx .grow{flex:1;min-width:0;display:grid;gap:4px}
.bx .grow>span{display:block}
.bx.due .btn{justify-self:start}
.ring text{font:800 15px var(--f-num);fill:var(--ink)}
.hp-meta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
.explain{color:var(--muted);max-width:60ch}
.explain b{color:var(--ink);font-weight:800}
.avatar{width:54px;height:54px;flex:none;border:2px solid var(--edge);border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;color:var(--boss)}
.avatar .px{width:30px;height:30px}
.ptitle{font:800 20px/1.1 var(--f-hud);margin:2px 0 7px}
.startcard{background:var(--lime-soft)}
.startcard h3{font-size:22px}
.penny{flex:none;display:block}
.penny-say{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--lime-soft);border:2px solid var(--edge);border-radius:18px;font:700 14px/1.35 var(--f-ui)}
.penny-say.over{background:var(--coral-soft)}
.penny-say b{font-weight:800}

/* event rows */
.evlist{list-style:none;margin:0;padding:0;display:grid}
.ev{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--rule)}
.ev:last-child{border-bottom:0}
.ev-ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--hit-soft);color:var(--hit)}
.ev-ico .px{width:18px;height:18px}
.ev.in .ev-ico{background:var(--lime-soft);color:var(--loot)}
.ev.debt .ev-ico{background:var(--coral-soft);color:var(--hit);overflow:hidden}
.ev.debt .ev-ico .mon{width:30px;height:30px}
.ev.spend .ev-ico{background:var(--warn-soft);color:var(--warn)}
.ev.xfer .ev-ico{background:var(--panel-2);color:var(--muted)}
.ev-main{min-width:0;display:grid;gap:1px}
.ev-main b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-main small{color:var(--muted);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-amt{font:800 15px/1.1 var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ev-amt small{display:block;font:600 11px/1.3 var(--f-ui);color:var(--muted)}
.ev.in .ev-amt{color:var(--loot)}
.ev.done .ev-main b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.ev.skipped{opacity:.5}
.ev.clickable{cursor:pointer}
.tick{width:34px;height:34px;border:2px solid var(--edge);border-radius:50%;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:transparent;box-shadow:0 2px 0 var(--edge)}
.tick .px{width:18px;height:18px;stroke-width:3.2}
.tick.on{background:var(--lime);color:var(--on-lime)}
.tick:active{transform:translateY(2px);box-shadow:none}
.nobtn{width:34px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 0 4px;border-bottom:2px solid var(--edge)}
.dayhead b{font:800 15px/1.2 var(--f-hud)}
.dayhead span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.chipline{display:inline-flex;gap:6px;align-items:center}

/* goals */
.quests ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.q{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--edge);border-radius:16px;background:var(--panel)}
.qbox{width:28px;height:28px;border:2px solid var(--edge);border-radius:50%;display:grid;place-items:center;color:var(--lime)}
.qbox .px{stroke-width:3.4}
.q.done{background:var(--lime-soft)}
.q.done .qbox{background:var(--ink)}
.q.done .qtext{color:var(--muted);text-decoration:line-through}
.qtext{font-weight:800;min-width:0}
.qtext small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none}
.qxp{font:800 13px/1 var(--f-ui);color:var(--boss);white-space:nowrap}
.side{background:var(--coral-soft)}
.side h3{font:800 26px/1.1 var(--f-num);letter-spacing:-.01em;margin:4px 0}

/* month */
.mapgrid{display:grid;gap:18px}
@media (min-width:900px){.mapgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthbar h2{font:800 24px/1 var(--f-hud)}
.msum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.msum div{display:grid;gap:3px}
.msum b{font:800 19px/1.1 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:520px){.msum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font:800 11px/1 var(--f-ui);color:var(--muted);text-align:center;padding:4px 0}
.cell{display:grid;align-content:start;gap:1px;min-height:62px;padding:5px;border:2px solid var(--rule);border-radius:12px;background:var(--panel);font:700 10px/1.2 var(--f-ui);text-align:left;cursor:pointer;min-width:0;overflow:hidden;color:var(--ink)}
.cell .cd{font:800 13px/1 var(--f-num);margin-bottom:2px}
.cell .ci{color:var(--loot);font-weight:800}
.cell .co{color:var(--hit);font-weight:800}
.cell .cb{color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}
.cell.past{background:var(--panel-2);border-color:transparent}
.cell.past .cb{display:none}
.cell.ok{background:var(--lime);border-color:var(--edge);color:var(--on-lime)}
.cell.ok .co,.cell.ok .ci{color:var(--on-lime)}
.cell.over{background:var(--coral-soft);border-color:var(--hit)}
.cell.pay{background:var(--sky-soft);border-color:var(--edge)}
.cell.today{border:3px solid var(--gold);box-shadow:0 2px 0 var(--edge)}
.cell.tight{background:var(--warn-soft);border-color:var(--warn)}
.cell.danger{background:var(--hit-soft);border-color:var(--hit)}
.cell.blank{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:2px solid var(--edge)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font:700 11px var(--f-ui);fill:var(--muted)}
.chart .t-strong{fill:var(--ink);font-weight:800}
.c-grid{stroke:var(--rule);stroke-width:1}
.c-zero{stroke:var(--muted);stroke-width:1.5}
.c-buf{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.c-line{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.c-life{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 4}
.c-pos{fill:var(--lime-soft)} .c-neg{fill:var(--hit-soft)}
.c-dot{fill:var(--coral);stroke:var(--panel);stroke-width:2}
.c-pay{fill:var(--loot)}
.c-bar{fill:var(--muted);opacity:.45} .c-bar-debt{fill:var(--coral)}
.c-inc{fill:none;stroke:var(--loot);stroke-width:2.4}
.c-today{stroke:var(--edge);stroke-width:1;stroke-dasharray:2 3}

/* debts: journey, bosses, monsters */
.mon{display:block;flex:none}
.gang{display:inline-flex;align-items:flex-end}
.gang .mon+.mon{margin-left:-16px}
.chapter{background:var(--gold);color:var(--gold-ink);display:grid;gap:8px}
.chapter .lbl{color:inherit;opacity:.9}
.chapter h1{font:800 clamp(26px,7vw,34px)/1.05 var(--f-hud)}
.chapter .hp{background:rgba(0,0,0,.28)}
.chapter .small{opacity:.92}
.path{list-style:none;margin:0;padding:8px 0 4px;display:grid;gap:16px}
.pnode{--x:0px;display:flex;align-items:center;gap:12px;padding-left:max(0px,calc(50% - 36px + var(--x)))}
.pnode.rt{flex-direction:row-reverse;padding-left:0;padding-right:max(0px,calc(50% - 36px - var(--x)))}
.pbtn{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.pnode.rt .pbtn{flex-direction:row-reverse;text-align:right}
.pdot{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--edge);box-shadow:0 5px 0 var(--edge);background:var(--panel);color:var(--ink);overflow:hidden}
.pdot .px{width:30px;height:30px;stroke-width:3}
.pnode.done .pdot{background:var(--lime);color:var(--on-lime)}
.pnode.done.kill .pdot{background:var(--lime-soft)}
.pnode.here .pdot{background:var(--gold);color:#fff;box-shadow:0 0 0 7px var(--gold-soft),0 5px 0 7px var(--edge)}
.pnode.boss .pdot{background:var(--coral-soft)}
.pnode.goal .pdot{background:var(--coin);color:#1C1238}
.pnode.more .pdot{width:48px;height:48px;margin-inline:12px;background:var(--panel-2);box-shadow:0 3px 0 var(--edge);font:800 13px/1 var(--f-ui)}
.plabel{min-width:0;max-width:180px;font:800 14px/1.25 var(--f-ui)}
.plabel small{display:block;font-weight:700;color:var(--muted);font-size:12px;margin-top:2px}
.pnode.rt .plabel{text-align:right}
.plabel .hp{margin-top:6px;width:130px}
.pnode.rt .plabel .hp{margin-left:auto}
.bossgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.boss{display:grid;gap:10px;align-content:start}
.boss-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.boss-ava{width:62px;height:62px;border:2px solid var(--edge);border-radius:18px;background:var(--coral-soft);display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer}
.boss h3{font:800 19px/1.1 var(--f-hud)}
.boss.dead .boss-ava{background:var(--lime-soft)}
.boss.dead h3{text-decoration:line-through}
.boss .hpnum,.stage .hpnum{display:flex;justify-content:space-between;gap:10px;width:100%;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.boss .hpnum b,.stage .hpnum b{font:800 17px/1 var(--f-num)}
.heads{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.heads li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:center;font-size:13px;font-weight:700;cursor:pointer}
.heads li .hp{grid-column:2/-1}
.heads li .mon{grid-row:span 2}
.heads li.dead{opacity:.5;text-decoration:line-through}
.bossmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.bossmeta b{display:block;color:var(--ink);font:800 14px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.bossview{display:grid;gap:14px}
.stage{display:grid;justify-items:center;gap:8px;padding:16px;background:var(--coral-soft);border:2px solid var(--edge);border-radius:24px;box-shadow:0 4px 0 var(--edge)}
.stage .hp{width:100%}
.stage.dead{background:var(--lime-soft)}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.final{display:grid;gap:12px;background:var(--gold-soft)}
.final .bigboss{font:800 clamp(40px,10vw,64px)/1 var(--f-num);letter-spacing:-.03em;color:var(--boss)}
.simgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.simgrid b{display:block;font:800 19px/1.15 var(--f-num)}
input[type=range]{width:100%;accent-color:var(--gold)}
.killorder{margin:10px 0 0;padding-left:20px;display:grid;gap:3px;font-size:13px;font-weight:700}
.unlocks{list-style:none;margin:0;padding:0;display:grid}
.unlocks li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:2px solid var(--rule);align-items:baseline}
.unlocks li:last-child{border-bottom:0}
.unlocks .um{font:800 14px/1 var(--f-num)}
.unlocks .uv{color:var(--loot);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:2px dashed var(--rule);border-radius:18px;font-size:13px;background:var(--panel-2)}
.trophy .px{width:26px;height:26px;color:var(--muted)}
.trophy b{display:block;font-weight:800}
.trophy small{color:var(--muted);line-height:1.25;display:block;font-weight:600}
.trophy.got{border:2px solid var(--edge);background:var(--panel)}
.trophy.got .px{color:var(--coin);fill:var(--coin);stroke:var(--ink)}
.player[role=button]{cursor:pointer}
.player .more{color:var(--boss);font-weight:800}
.dfree{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dfree b{font:800 24px/1.1 var(--f-num);color:var(--loot)}
.sim-focus{margin:10px 0 0;padding:10px 12px;border:2px solid var(--edge);border-radius:16px;background:var(--lime-soft);font-size:14px;display:flex;gap:10px;align-items:center}
.sim-focus .px{width:20px;height:20px;color:var(--loot);flex:none}
.lvroad{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lv{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--rule);border-radius:18px}
.lv.now{border-color:var(--edge);background:var(--gold-soft)}
.lv.lock{opacity:.62}
.lv-n{font:800 16px/1 var(--f-num);text-align:center}
.lv-av{width:44px;height:44px;border:2px solid var(--edge);border-radius:14px;display:grid;place-items:center;background:var(--panel-2);color:var(--boss)}
.lv-av .px{width:24px;height:24px}
.lv.lock .lv-av{color:var(--muted)}
.lv-t{min-width:0}
.lv-t b{display:block;font:800 15px/1.2 var(--f-hud)}
.lv-t small{color:var(--muted);font-size:12px;font-weight:600}
.lv-s{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.xpgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:14px;margin:0}
.xpgrid dt{margin:0}.xpgrid dd{margin:0;font:800 14px/1.3 var(--f-num);text-align:right}
.xpgrid dt small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.lvhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.lvup{justify-items:center;text-align:center;padding-top:6px}
.lvup-badge{width:110px;height:110px;border:3px solid var(--edge);border-radius:50%;background:var(--coin);display:grid;place-items:center;color:#1C1238;box-shadow:0 6px 0 var(--edge);animation:pop .55s ease-out}
.lvup-badge .px{width:56px;height:56px;stroke-width:2.6}
.lvup-title{font:800 34px/1.1 var(--f-hud)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.lvup-badge{animation:none}}
.hzgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.hzgrid div{border:2px solid var(--rule);border-radius:12px;padding:7px 8px;font-size:12px;color:var(--muted)}
.hzgrid div.on{border-color:var(--edge);background:var(--gold-soft);color:var(--ink)}
.hzgrid b{display:block;font:800 16px/1.2 var(--f-num);color:var(--ink)}
.prev{border:2px dashed var(--edge);border-radius:16px;padding:10px 12px;font-size:14px;background:var(--panel-2)}
.prev.kill{border-style:solid;background:var(--lime-soft)}
.st-mon{display:flex;justify-content:center}

/* bills & history */
.twocol{display:grid;gap:18px}
@media (min-width:900px){.twocol{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:start}}
.sumrows{display:grid;gap:0}
.sumrows div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px solid var(--rule);font-variant-numeric:tabular-nums}
.sumrows div:last-child{border-bottom:0}
.sumrows .tot{font-weight:800;border-top:2px solid var(--edge)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:2px solid var(--edge);background:var(--panel);border-radius:999px;padding:8px 13px;font:800 13px/1 var(--f-ui);cursor:pointer;color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.group{display:grid;gap:0}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 6px;border-bottom:2px solid var(--edge)}
.group-h b{font:800 17px/1 var(--f-hud)}
.group-h span{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 4px;border-bottom:2px solid var(--rule);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:var(--ink)}
.bill:hover{background:var(--panel-2)}
.bill .bn{font-weight:800;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.bill .bm{font-size:12px;font-weight:600;color:var(--muted);grid-column:1}
.bill .ba{font:800 15px/1.2 var(--f-num);font-variant-numeric:tabular-nums;text-align:right;grid-row:1/3;grid-column:2;align-self:center;white-space:nowrap}
.bill .ba small{display:block;font:600 11px/1.3 var(--f-ui);color:var(--muted)}
.bill.paused{opacity:.5}
.catbars{display:grid;gap:8px}
.catbar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.catbar .cbt{height:12px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1.5px solid var(--rule)}
.catbar .cbt i{display:block;height:100%;background:var(--coral)}
.catbar span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--panel);border:2px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -4px 0 var(--edge)}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-bottom:2px solid var(--edge);border-radius:28px;box-shadow:0 6px 0 var(--edge);padding-bottom:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font:800 23px/1.15 var(--f-hud)}
.form{display:grid;gap:14px}
.fld{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
.fld>span,.fld>legend{font:800 11px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:6px}
.fld>span{margin-bottom:0}
.fld small{color:var(--muted);font-size:12px;font-weight:600}
.form input[type=text],.form input[type=password],.form input[type=search],.form input[type=date],.form input[type=number],.form select,#sim-target,.form textarea{font:700 16px/1.2 var(--f-ui);color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);border-radius:14px;padding:12px 13px;width:100%;min-width:0}
.form input:focus,.form select:focus,#sim-target:focus,.form textarea:focus{outline:3px solid var(--gold-soft);outline-offset:0;border-color:var(--gold)}
.form textarea{font:500 12px/1.4 ui-monospace,Menlo,monospace;min-height:120px;resize:vertical}
.form input.amt{font:800 30px/1 var(--f-num);padding:12px;letter-spacing:-.01em}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:9px 13px;border:2px solid var(--edge);border-radius:999px;font:800 14px/1 var(--f-ui);cursor:pointer;background:var(--panel)}
.chip input:checked+span{background:var(--gold);color:var(--gold-ink)}
.chip input:focus-visible+span{outline:3px solid var(--boss);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.seg{display:flex;gap:4px;padding:4px;background:var(--panel-2);border:2px solid var(--edge);border-radius:16px;overflow-x:auto;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px 10px;border-radius:12px;font:800 13px/1 var(--f-ui);white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.err{color:var(--hit);font-size:13px;font-weight:800}
.hint{background:var(--panel-2);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.alertbox{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:2px solid var(--hit);border-radius:var(--r);padding:12px 14px;background:var(--panel);font-size:14px;line-height:1.45}
.alertbox .btn{flex:none}
.recur{display:grid;gap:10px;padding:12px 14px;border:2px solid var(--edge);border-radius:18px;background:var(--panel)}
.recur small{display:block;margin-top:2px;font-weight:600}
.steps{display:flex;gap:6px;margin:0 0 14px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--rule)}.steps i.on{background:var(--gold)}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:19;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--panel);color:var(--ink);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);font-size:13px;font-weight:800;opacity:0;pointer-events:none;transform:translate(-50%,-80px);transition:opacity .15s}
.ptr.on{opacity:1}
.ptr svg{width:18px;height:18px;transition:transform .15s}
.ptr.ready svg{transform:rotate(180deg)}
.ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ptr.spin svg{animation:none}}
.receipt{display:grid;gap:8px}
.hint b{color:var(--ink)}
.formrow{display:flex;gap:10px;flex-wrap:wrap}
.formrow .btn{flex:1}
.qamt{display:grid;justify-items:center;gap:6px;text-align:center}
.qamt span{font:800 56px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qamt small{font:700 13px/1 var(--f-ui);color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keypad button{height:54px;border:2px solid var(--edge);border-radius:16px;background:var(--panel-2);color:var(--ink);font:800 23px/1 var(--f-num);box-shadow:0 3px 0 var(--edge);cursor:pointer;display:grid;place-items:center}
.keypad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.keypad .px{width:24px;height:24px}
details.more{border:2px solid var(--rule);border-radius:16px;padding:4px 12px}
details.more[open]{padding-bottom:12px}
details.more summary{cursor:pointer;font:800 14px/1 var(--f-ui);color:var(--boss);padding:10px 0;list-style-position:inside}
details.more .stack{margin-top:6px}

/* toasts */
#toasts{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:18px;padding:12px 15px;font:700 14px/1.3 var(--f-ui);box-shadow:0 3px 0 var(--edge);animation:tin .25s ease-out both}
.toast b{font-weight:800;color:var(--boss)}
.toast.big{background:var(--gold);color:var(--gold-ink);font:800 19px/1.2 var(--f-hud);text-align:center;padding:16px}
.toast.big b{color:var(--lime)}
.toast.bad{background:var(--hit);color:#fff}
.toast.out{animation:tout .3s ease-in both}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:10px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.empty{display:grid;gap:12px;justify-items:start;max-width:560px;margin:8vh auto 0}
.empty h1{font:800 36px/1.05 var(--f-hud)}
.loadpx{display:flex;gap:6px}
.loadpx i{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--edge);animation:blink 1s infinite}
.loadpx i:nth-child(2){animation-delay:.2s}.loadpx i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25;transform:translateY(-4px)}}
.banner{font-size:12px;color:var(--muted);text-align:center;padding:14px 0 0}
.banner .linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;cursor:pointer}
.nudge{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border:2px dashed var(--edge);border-radius:var(--r);padding:12px 14px;background:var(--panel-2);font-size:14px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label{-webkit-tap-highlight-color:transparent}
.btn.ghost.danger{color:var(--hit)}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="brand"><span id="brand-ico"></span><span class="bt">Debt Slayer</span></div>
      <span class="spacer"></span>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <span id="lv"></span>
      <button class="iconbtn" data-act="search" aria-label="Search" id="searchbtn"></button>
      <button class="iconbtn" data-act="theme" id="themebtn"></button>
      <button class="iconbtn" data-act="settings" aria-label="Settings" id="gear"></button>
    </div>
  </header>
  <main class="wrap" id="main">
    <section id="v-boot">
      <div class="empty">
        <div class="loadpx"><i></i><i></i><i></i></div>
        <h1>Loading your board</h1>
        <p class="muted">Your money for today, the bills coming up, and the debts you're fighting will show here.</p>
      </div>
    </section>
  </main>
  <button class="fab" data-act="log" data-tab="spend" id="fab" hidden></button>
  <div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14 M6 12l6 6 6-6"/></svg><span id="ptr-t">Pull to sync</span></div>
</div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const CATS = ['Home','Debts','Klarna','Insurance','Business tools','Ads','Phone & internet','Banking & admin','Personal','Other bills'];

    set: (p, data) => serial(p, () => db.doc(p).set(data)),

function compute() {

  const past = early < T ? occ(addD(early, 1), T).filter(o => o.date > syncOf(o.acct).d) : [];

function monthStats(m) {

/* ---------- debts ---------- */
function debtOf(it) {

  let paid = 0, total = 0, rem = 0, full = +it.struck || 0, next = null, nextOrig = null, last = null;

/* ---------- game layer ---------- */
function progress() {
  const spentOn = {}, perDay = {};
  TXNS.forEach(t => { if (t.src !== 'live') perDay[t.date] = (perDay[t.date] || 0) + 1; if (t.kind === 'exp') spentOn[t.date] = (spentOn[t.date] || 0) + (+t.eur || 0); });

  Object.values(perDay).forEach(n => { parts.log += 5 * Math.min(n, 10); });
  const doneN = Object.values(MARKS.done).filter(Boolean).length; parts.ticks = 10 * doneN;
  const syncDays = new Set((S.syncs || []).map(s => s.d)).size; parts.syncs = 25 * syncDays;
  const pays = TXNS.filter(t => t.kind === 'pay');
  parts.strikes = sum(pays.map(t => Math.floor((+t.eur || 0) / 10)));

  const first = Object.keys(DAYS.d).sort()[0];
  if (first) for (let d = first, i = 0; d < T && i < 3650; d = addD(d, 1), i++) { if (ok(d)) { under++; best = Math.max(best, ++cur); } else cur = 0; }
  Object.keys(DAYS.d).forEach(d => { if (d < T && DAYS.d[d] && DAYS.d[d].ns && !(spentOn[d] > 0)) ns++; });
  parts.under = 20 * under; parts.ns = 30 * ns;
  const kills = ITEMS.filter(i => i.debt && i.count != null && !i.income).map(debtOf).filter(d => d.dead).length;
  const klarnaKill = ITEMS.filter(i => i.debt && i.group === 'Klarna' && i.count != null).map(debtOf).some(d => d.dead);
  const loanKill = ITEMS.filter(i => i.debt && !i.group && i.count != null).map(debtOf).some(d => d.dead);
  parts.kills = 150 * kills;
  let streak = 0;

  const sideMonths = {};
  TXNS.forEach(t => { if (t.kind === 'inc') sideMonths[ym(t.date)] = (sideMonths[ym(t.date)] || 0) + (+t.eur || 0); });
  ITEMS.forEach(i => { if (i.income && i.freq === 'once' && MARKS.done[i.id + '@' + i.start]) sideMonths[ym(i.start)] = (sideMonths[ym(i.start)] || 0) + eurOf(i, i.amt); });

    {name: 'First Blood', desc: 'Log or tick off your first money in or out', got: TXNS.length > 0 || doneN > 0},
    {name: 'Eyes Open', desc: 'Enter your real account balances', got: syncDays > 0},
    {name: 'Iron Wallet', desc: 'Lock in a no-spend day', got: ns > 0},
    {name: 'On Fire', desc: '7 days in a row under your limit', got: best >= 7},
    {name: 'Head Hunter', desc: 'Finish a Klarna plan', got: klarnaKill},
    {name: 'Boss Down', desc: 'Fully pay off a loan', got: loanKill},
    {name: 'Side Hustler', desc: 'Earn $1,000 extra in one month', got: bestSideUSD >= 1000},
    {name: 'Money Mover', desc: 'Log a move between accounts', got: TXNS.some(t => t.kind === 'xfer')},
    {name: 'Clean Inbox', desc: 'Tick off 25 bills', got: doneN >= 25},
    {name: 'Critical Hit', desc: 'Strike a boss with €500 or more at once', got: pays.some(t => +t.eur >= 500)},
  ];
  parts.trophies = 50 * ach.filter(a => a.got).length;

}

/* ----- shared bits ----- */
function evRow(o, opt = {}) {

  const cls = inc ? 'in' : it.debt ? 'debt' : 'out';
  const ico = inc ? 'coin' : it.debt ? 'skull' : 'sword';
  const name = it.group ? `${it.group} · ${it.name}` : it.name;
  const meta = [opt.date ? fmtD(o.date) : '', acctName(o.acct), o.orig !== o.date ? `moved from ${fmtDs(o.orig)}` : '', opt.note ? it.note || '' : '', o.done && (MARKS.via || {})[o.key] ? 'seen at the bank' : ''].filter(Boolean).join(' · ');

function balChart(points, {h = 210, buf = 0, life = 0, pays = []} = {}) {

    ${g}

    <line class="c-zero" x1="${L}" x2="${W - Rr}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>

function vMap() {
  const m = mapMonth || ym(T);

  const st = monthStats(m);
  const pj = to > M.end ? project(M.now, to) : {days: M.proj};
  const balOn = new Map(pj.days.map(p => [p.date, p.bal]));
  const os = occ(from, to, true);
  const first = P(from).getDay(), lead = (first + 6) % 7;
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="wd">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="cell blank"></div>';
  const n = dim(+m.slice(0, 4), +m.slice(5, 7));
  for (let dd = 1; dd <= n; dd++) {
    const d = `${m}-${pad(dd)}`;
    const o = os.filter(x => x.date === d && !x.skip);
    const tx = TXNS.filter(t => t.date === d);
    const inc = sum(o.filter(x => x.v > 0).map(x => x.v)) + sum(tx.filter(t => t.kind === 'inc').map(t => t.eur));
    const out = -sum(o.filter(x => x.v < 0).map(x => x.v)) + sum(tx.filter(t => t.kind === 'exp' || t.kind === 'pay').map(t => t.eur));
    const bal = d >= T ? balOn.get(d) : null;
    const okd = d < T ? dayOk(d) : null;
    const cls = [d < T ? 'past' : '', okd === true ? 'ok' : okd === false ? 'over' : '', inc > 500 && d >= T ? 'pay' : '', d === T ? 'today' : '', bal != null && bal < 0 ? 'danger' : bal != null && bal < M.buf ? 'tight' : ''].join(' ');
    cells += `<button class="cell ${cls}" data-act="day" data-date="${d}" aria-label="${fmtD(d)}${out ? ', out ' + eur(out, 0) : ''}${inc ? ', in ' + eur(inc, 0) : ''}"><span class="cd">${dd}</span>${inc ? `<span class="ci">+${kfmt(inc)}</span>` : ''}${out ? `<span class="co">−${kfmt(out)}</span>` : ''}${bal != null ? `<span class="cb">${kfmt(bal)}</span>` : ''}</button>`;
  }
  const endBal = balOn.get(to);
  let agenda = '';
  for (let dd = 1; dd <= n; dd++) {
    const d = `${m}-${pad(dd)}`;
    const o = os.filter(x => x.date === d), tx = TXNS.filter(t => t.date === d);
    if (!o.length && !tx.length) continue;
    const bal = d >= T ? balOn.get(d) : null;
    agenda += `<div class="dayhead"><b>${fmtD(d)}${d === T ? ' · Today' : ''}</b><span>${bal != null ? 'then ' + eur(bal, 0) : ''}</span></div><ul class="evlist">${o.map(x => evRow(x)).join('')}${tx.map(t => txnRow(t)).join('')}</ul>`;
  }
  const canPrev = m > ym(S.created || T) || m > addM(ym(T), -3);
  return `<div class="mapgrid"><div class="stack" style="gap:18px">
    <div class="pn stack">
      <div class="monthbar"><button class="iconbtn" data-act="mapmove" data-k="-1" aria-label="Previous month" ${canPrev ? '' : 'disabled'}>‹</button><h2>${fmtM(m)}</h2><button class="iconbtn" data-act="mapmove" data-k="1" aria-label="Next month">›</button></div>
      <div class="msum"><div><span class="lbl">Coming in</span><b class="good">${eur(st.inc + st.side + st.expect, 0)}</b></div><div><span class="lbl">Bills</span><b class="bad">${eur(st.bills, 0)}</b></div><div><span class="lbl">Spent</span><b>${eur(st.spent, 0)}</b></div><div><span class="lbl">End balance</span><b class="${endBal != null && endBal < 0 ? 'bad' : ''}">${endBal != null ? eur(endBal, 0) : '—'}</b></div></div>
      <div class="cal">${cells}</div>
      <div class="legend"><span><i style="background:var(--lime)"></i>Under your limit</span><span><i style="background:var(--sky-soft)"></i>Payday</span><span><i style="background:var(--warn-soft);border-color:var(--warn)"></i>Below cushion</span><span><i style="background:var(--hit-soft);border-color:var(--hit)"></i>Below zero</span><span>Small number = balance that night</span></div>
    </div>
    ${chartBlock(M.proj.slice(0, Math.min(M.proj.length, 76)), 'Your money, day by day')}
  </div>
  <section class="sec"><div class="sec-h"><h2>Every payment in ${MONTHS[+m.slice(5, 7) - 1]}</h2><span class="small muted">Tap a payment to change its amount or date</span></div>${agenda || '<p class="muted">Nothing this month.</p>'}</section></div>`;
}

/** the limit a day is judged by: the snapshot taken when the app was open that day. On a day it stayed closed but the bank
    covered (live sync ran after the day ended), the last snapshot before it, and the spending the bank logged */
function dayLimit(d) {
  const r = DAYS.d[d]; if (r) return r.t ?? r.a ?? 0;
  const L = S.live || {};
  if (!(L.since && d >= L.since && d < T && (L.lastAt || 0) > P(addD(d, 1)).getTime())) return null;
  for (let k = 1; k <= 14; k++) { const p = DAYS.d[addD(d, -k)]; if (p) return p.t ?? p.a ?? 0; }
  return null;
}
function dayOk(d) {
  const lim = dayLimit(d); if (lim == null) return null;
  const sp = sum(TXNS.filter(t => t.kind === 'exp' && t.date === d).map(t => +t.eur || 0));
  return sp <= lim + 0.005;
}
function weekGoal() {
  const dow = (P(T).getDay() + 6) % 7, mon = addD(T, -dow);
  let ok = 0; for (let i = 0; i < dow; i++) if (dayOk(addD(mon, i))) ok++;
  return ok;
}
function journey(base) {

  all.filter(d => d.dead).sort((a, b) => ((a.it.paidOff || a.last || '') < (b.it.paidOff || b.last || '') ? -1 : 1))
    .forEach(d => done.push({t: `${debtName(d.it)} defeated`, s: d.it.paidOff ? 'Struck ' + fmtDs(d.it.paidOff) : 'Paid off', mon: d.it.id}));
  const fall = d => d.unknown ? '9999-99' : (base.done[d.it.id] || (d.last ? ym(d.last) : '9998-99'));
  const live = all.filter(d => !d.dead).sort((a, b) => fall(a) < fall(b) ? -1 : fall(a) > fall(b) ? 1 : a.rem - b.rem);
  const wk = weekGoal(), hidden = Math.max(0, done.length - 3), nodes = [];
  if (hidden) nodes.push({k: 'more', t: `${hidden} earlier win${hidden > 1 ? 's' : ''}`});
  done.slice(-3).forEach(n => nodes.push(Object.assign({k: 'done'}, n)));
  nodes.push({k: 'here', t: `${Math.min(wk, 5)} of 5 days under your limit`, s: 'This week · you are here', pct: Math.min(1, wk / 5)});
  live.forEach(d => nodes.push({k: 'boss', d, t: debtName(d.it), s: d.unknown ? 'HP unknown · tap to reveal' : `${eur(d.rem, 0)} HP · falls ${fmtMs(fall(d))}`, s2: d.unknown ? '' : `then +${eur(d.monthly, 0)}/mo is yours`}));
  nodes.push({k: 'goal', t: 'Debt-free', s: base.finish ? fmtM(base.finish) : 'Reveal every boss to see the date'});
  return nodes.map((n, i) => {
    const x = Math.round(Math.sin(i * 1.15) * 78), rt = x > 12;
    const cls = `pnode ${n.k}${n.mon ? ' kill' : ''}${rt ? ' rt' : ''}`, st = `--x:${x}px`;
    const label = `<span class="plabel">${esc(n.t)}${n.s ? `<small>${esc(n.s)}</small>` : ''}${n.s2 ? `<small>${esc(n.s2)}</small>` : ''}${n.k === 'here' ? `<span class="hp sm" style="display:block"><i style="width:${(n.pct * 100).toFixed(0)}%"></i></span>` : ''}</span>`;
    if (n.k === 'boss') {
      const d = n.d;
      return `<li class="${cls}" style="${st}"><button class="pbtn" data-act="boss" data-id="${esc(d.it.id)}"><span class="pdot">${monsterSVG(d.it.id, {size: 64, hp: d.full ? d.rem / d.full : 1, label: debtName(d.it) + ' monster'})}</span>${label}</button></li>`;
    }
    const dot = n.k === 'done' ? (n.mon ? monsterSVG(n.mon, {size: 60, dead: true, label: n.t}) : px('check')) : n.k === 'here' ? px('star') : n.k === 'goal' ? px('crown') : `+${hidden}`;

  }).join('');
}

function futureChart() {
  const n = 30, rows = [];
  for (let i = 1; i <= n; i++) { const mm = addM(ym(T), i), st = monthStats(mm); rows.push({m: mm, bills: st.bills, debt: st.debt, inc: st.inc}); }

}

/* ----- Bills ----- */
function vBills() {
  const active = ITEMS.filter(i => {
    if (i.freq === 'once') return i.start >= addD(T, -7);
    if (i.count == null) return true;
    const last = rawOcc(i, i.start, '9999-12-31').slice(-1)[0];
    return last && last >= T;
  });
  const bills = active.filter(i => !i.income);
  const incomes = active.filter(i => i.income);
  const live = bills.filter(i => !i.paused && i.freq !== 'once');
  const tot = sum(live.map(monthlyOf)), biz = sum(live.filter(i => i.biz).map(monthlyOf)), debt = sum(live.filter(i => i.debt).map(monthlyOf));
  const sal = sum(incomes.filter(i => !i.paused && i.freq !== 'once').map(monthlyOf));
  const f = billFilter;
  const shown = bills.filter(i => f === 'all' || (f === 'biz' && i.biz) || (f === 'private' && !i.biz) || (f === 'debt' && i.debt) || (f === 'guess' && i.guess));
  const groups = {};
  shown.forEach(i => { const c = i.cat || 'Other bills'; (groups[c] = groups[c] || []).push(i); });
  const order = Object.keys(groups).sort((a, b) => (CATS.indexOf(a) + 99) % 99 - (CATS.indexOf(b) + 99) % 99 || a.localeCompare(b));
  const fb = (id, label) => `<button class="fbtn" data-act="filter" data-f="${id}" aria-pressed="${f === id}">${label}</button>`;
  return `<div class="twocol">
    <div class="stack" style="gap:18px">
      <section class="pn sec"><h2>Every month</h2>
        <div class="sumrows"><div><span>Salary (${usd(sal / rate())} at ${(+S.fx).toFixed(4)})</span><span class="good">${eur(sal, 0)}</span></div>
        <div><span>Fixed bills</span><span class="bad">−${eur(tot, 0)}</span></div>
        <div class="tot"><span>Left for life &amp; debt attacks</span><span class="${sal - tot < 0 ? 'bad' : 'good'}">${eur(sal - tot, 0)}</span></div></div>
        <div class="sumrows small"><div><span>Business costs</span><span>${eur(biz, 0)}</span></div><div><span>Private costs</span><span>${eur(tot - biz, 0)}</span></div><div><span>Of that, debt payments</span><span>${eur(debt, 0)}</span></div></div>
        <p class="small muted">Business costs are usually tax-deductible. Keep every receipt in SevDesk and check with your Steuerberater.</p>
      </section>
      <section class="sec"><div class="sec-h"><h2>Income</h2><button class="btn sm" data-act="newitem" data-income="1">${px('plus')} Add income</button></div>
        <div class="group">${incomes.map(billRow).join('') || '<p class="muted">No regular income yet.</p>'}</div>
        <p class="small muted">Affiliate, Skool and sponsorship money comes in on random days. Log it with the Log button when it lands, or add an expected payment with a future date.</p></section>
    </div>
    ${recurBlock()}<section class="sec"><div class="sec-h"><h2>Bills</h2><button class="btn sm gold" data-act="newitem">${px('plus')} Add bill</button></div>
      ${missingList().length ? `<div class="addprev"><span>${missingList().length} plan${missingList().length > 1 ? 's' : ''} may be missing a payment this month.</span><button class="btn sm" data-act="missing">Check</button></div>` : ''}
      <div class="filters">${fb('all', 'All')}${fb('biz', 'Business')}${fb('private', 'Private')}${fb('debt', 'Debts')}${ITEMS.some(i => i.guess) ? fb('guess', 'Guessed dates') : ''}</div>
      ${order.map(c => `<div class="group"><div class="group-h"><b>${esc(c)}</b><span>${eur(sum(groups[c].filter(i => !i.paused).map(monthlyOf)), 0)}/mo</span></div>${groups[c].sort((a, b) => (a.order || 0) - (b.order || 0)).map(billRow).join('')}</div>`).join('') || '<p class="muted">Nothing matches this filter.</p>'}
    </section></div>`;
}
function nextOf(it) {
  const os = occ(T, addD(T, 400)).filter(o => o.it.id === it.id);
  return os[0] ? os[0].date : null;
}
function billRow(i) {
  const when = i.freq === 'days' ? `every ${i.every} days` : i.freq === 'once' ? `once, ${fmtD(i.start)}` : `${ord(i.day || +i.start.slice(8))} of the month`;
  const nx = i.paused ? null : nextOf(i);
  const d = i.count != null && i.freq !== 'once' ? debtOf(i) : null;
  const tags = [i.biz ? '<span class="tag biz">Business</span>' : '', i.debt ? '<span class="tag debt">Debt</span>' : '', i.guess ? '<span class="tag guess">Date guessed</span>' : '', i.paused ? '<span class="tag">Paused</span>' : '', d ? `<span class="tag">${d.left} left</span>` : ''].join('');
  const amt = i.cur === 'USD' ? `${usd(i.amt, i.amt % 1 ? 2 : 0)}<small>≈ ${eur(eurOf(i, i.amt), 0)}</small>` : eur(i.amt);
  const meta = [when, acctName(i.acct), nx ? 'next ' + fmtDs(nx) : '', i.note || ''].filter(Boolean).join(' · ');
  return `<button class="bill ${i.paused ? 'paused' : ''}" data-act="item" data-id="${esc(i.id)}"><span class="bn">${esc(i.group ? i.group + ' · ' + i.name : i.name)} ${tags}</span><span class="ba ${i.income ? 'good' : ''}">${amt}${i.freq === 'days' ? `<small>≈ ${eur(monthlyOf(i), 0)}/mo</small>` : ''}</span><span class="bm">${esc(meta)}</span></button>`;
}

/* ----- Log ----- */
function vLog() {
  const m = logMonth || ym(T);
  const from = m + '-01', to = monthEnd(from);
  const st = monthStats(m);
  const list = TXNS.filter(t => t.date >= from && t.date <= to).map(t => ({date: t.date, at: t.at || 0, out: t.kind === 'exp' || t.kind === 'pay' ? +t.eur || 0 : 0, inn: t.kind === 'inc' ? +t.eur || 0 : 0, html: txnRow(t)}))
    .concat(st.os.filter(o => o.done).map(o => ({date: o.date, at: +MARKS.done[o.key] || 0, out: o.v < 0 ? -o.v : 0, inn: o.v > 0 ? o.v : 0, html: evRow(o)})))
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.at - a.at);
  const cats = Object.entries(st.byCat).sort((a, b) => b[1] - a[1]);
  const maxC = Math.max(1, ...cats.map(c => c[1]));
  let html = '', cur = null;
  list.forEach(r => {
    if (r.date !== cur) {
      if (cur) html += '</ul>'; cur = r.date;
      const day = list.filter(x => x.date === r.date), o = sum(day.map(x => x.out)), i = sum(day.map(x => x.inn));
      html += `<div class="dayhead"><b>${fmtD(r.date)}</b><span>${[o ? 'out ' + eur(o) : '', i ? 'in ' + eur(i) : ''].filter(Boolean).join(' · ')}</span></div><ul class="evlist">`;
    }
    html += r.html;
  });
  if (cur) html += '</ul>';
  return `<div class="twocol">
    <div class="stack" style="gap:18px">
      <div class="pn stack">
        <div class="monthbar"><button class="iconbtn" data-act="logmove" data-k="-1" aria-label="Previous month">‹</button><h2>${fmtM(m)}</h2><button class="iconbtn" data-act="logmove" data-k="1" aria-label="Next month" ${m >= ym(T) ? 'disabled' : ''}>›</button></div>
        <div class="msum"><div><span class="lbl">Spent</span><b>${eur(st.spent, 0)}</b></div><div><span class="lbl">Per day</span><b>${eur(st.spent / Math.max(1, m === ym(T) ? +T.slice(8) : dim(+m.slice(0, 4), +m.slice(5, 7))), 0)}</b></div><div><span class="lbl">Side income</span><b class="good">${usd(st.side / rate())}</b></div><div><span class="lbl">Bills paid</span><b>${eur(st.paidBills + st.struck, 0)}</b></div></div>
      </div>
      <section class="pn sec"><h2>Where it went</h2>${cats.length ? `<div class="catbars">${cats.map(([c, v]) => `<div class="catbar"><span>${esc(c)}</span><span class="cbt"><i style="width:${(v / maxC * 100).toFixed(1)}%"></i></span><span>${eur(v, 0)}</span></div>`).join('')}</div>` : '<p class="muted">No spending logged this month.</p>'}</section>
    </div>
    <section class="sec"><div class="sec-h"><h2>Everything that happened</h2><button class="btn sm gold" data-act="log" data-tab="spend">${px('plus')} Log</button></div><p class="small muted">Spending, income, moves, strikes and every bill or payment you ticked off.</p>${html || `<p class="muted">Nothing yet in ${MONTHS[+m.slice(5, 7) - 1]}. Tick bills as they go out, and tap Log when you spend or earn something.</p>`}</section>
  </div>`;
}

/* ----- search ----- */
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function searchOut(q) {
  q = String(q || '').trim();

  const toks = norm(q).split(/\s+/).filter(Boolean);

  const textHit = s => toks.every(t => s.includes(t));
  const kinds = {exp: 'spend spending', inc: 'income earned', xfer: 'move transfer', pay: 'strike debt payoff'};
  const items = ITEMS.filter(i => textHit(norm([i.name, i.group, i.note, i.cat, acctName(i.acct), i.income ? 'income' : 'bill', i.debt ? 'debt boss' : '', i.biz ? 'business' : 'private', i.paused ? 'paused' : ''].join(' '))) || amtHit(eurOf(i, i.amt)) || amtHit(i.amt))
    .sort((a, b) => (!!a.paused - !!b.paused) || norm(debtName(a)).localeCompare(norm(debtName(b))));
  const ids = new Set(items.map(i => i.id));
  const os = occ(addD(T, -60), addD(T, 120), true).filter(o => ids.has(o.it.id) || amtHit(o.v));
  const up = os.filter(o => o.date >= T).slice(0, 10), past = os.filter(o => o.date < T).reverse().slice(0, 6);
  const txs = TXNS.filter(t => textHit(norm([t.note, t.cat, t.src, acctName(t.acct), t.to ? acctName(t.to) : '', kinds[t.kind]].join(' '))) || amtHit(t.eur) || amtHit(t.orig))
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || 0) - (a.at || 0)).slice(0, 12);
  if (!items.length && !os.length && !txs.length) return `<p class="muted" style="margin-top:12px">Nothing matches “${esc(q)}”. Try part of a name, an account like Wise, or an amount.</p>`;

    const pv = !i.firstOk && missingPrev(i);
    const ended = !i.paused && i.freq !== 'once' && !nextOf(i);
    return billRow(i).replace('</span><span class="ba', `${ended ? ' <span class="tag">Finished</span>' : ''}</span><span class="ba`)
      + (pv ? `<div class="addprev"><span>Starts ${fmtD(i.start)}. Also a payment on <b>${fmtD(pv)}</b>?</span><button class="btn sm gold" data-act="addprev" data-id="${esc(i.id)}">${px('plus')} Add it</button></div>` : '');

/* ----- strike: pay off part or all of a debt at once ----- */
function strikePlan(it, R, L, mode) {
  const d = debtOf(it);
  const R2 = r2(Math.max(0, R - L));
  const nx = d.unknown ? nextInfo(Object.assign({}, it, {count: null})).next : (d.nextOrig || T);
  const idx = rawOcc(Object.assign({}, it, {count: null}), it.start, addD(nx, -1)).length;
  const base = {struck: r2((+it.struck || 0) + Math.min(L, R)), owed: R2, owedOn: T, paidOff: null};
  if (R2 <= 0.005) return {kill: true, R2: 0, patch: Object.assign(base, {count: idx, lastAmt: null, paidOff: T})};
  const a = baseAmt(it, nx);
  if (mode === 'lower') {
    const n = d.unknown ? Math.ceil(R / a - 1e-6) : Math.max(1, d.left);
    const na = Math.ceil(R2 / n * 100) / 100, last = r2(R2 - (n - 1) * na);
    if (last > 0) return {R2, n, a, newAmt: na, patch: Object.assign(base, {count: idx + n, amt: na, amtHist: histWith(it, nx), lastAmt: Math.abs(last - na) < 0.005 ? null : last})};
  }
  const n = Math.ceil(R2 / a - 1e-6), last = r2(R2 - (n - 1) * a);
  return {R2, n, a, patch: Object.assign(base, {count: idx + n, lastAmt: Math.abs(last - a) < 0.005 ? null : last})};
}

  const f = $('form[data-form="strike"]'); if (!f) return null;
  const fd = new FormData(f), it = ITEMS.find(i => i.id === fd.get('id')); if (!it) return null;
  const d = debtOf(it), R = d.unknown ? num(fd.get('owed')) : d.rem, L = num(fd.get('amt'));
  return {f, fd, it, d, R, L, acct: fd.get('acct'), mode: fd.get('after')};
}

  const hit = Math.min(L, R), plan = strikePlan(it, R, hit, s.mode);

/* ----- live exchange rate (ECB via frankfurter.dev) ----- */
async function refreshFx(force) {
  if (!S || locked || !store) return null;
  if (!force && (S.fxAuto === false || S.fxDate === T)) return null;
  try {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR', {signal: ctl.signal});
    clearTimeout(tm);
    const j = await r.json(), v = j && j.rates && +j.rates.EUR;
    if (!(v > 0.4 && v < 2)) throw new Error('No rate in the answer');
    const fx = Math.round(v * 10000) / 10000;
    fxErr = null;
    await store.update('fin/settings', {fx, fxDate: T, fxSrc: 'ECB ' + (j.date || T), fxAuto: S.fxAuto === false && !force ? false : (force ? true : S.fxAuto !== false)});
    return fx;
  } catch (e) { console.warn('fx', e); fxErr = 'Could not reach the rate service, so I kept your last rate.'; return null; }
}

/* ---------- data ops ---------- */
function exportAll() {
  const strip = o => { const c = Object.assign({}, o); delete c.id; return c; };
  return {settings: S, marks: MARKS, days: DAYS, items: Object.fromEntries(ITEMS.map(i => [i.id, strip(i)])), txns: Object.fromEntries(TXNS.map(t => [t.id, strip(t)]))};
}
async function importAll(obj) {
  if (!obj || !obj.settings) throw new Error('That backup has no settings in it.');
  await store.set('fin/settings', obj.settings);
  await store.set('fin/marks', obj.marks || {done: {}, ov: {}});
  await store.set('fin/days', obj.days || {d: {}});
  for (const [id, it] of Object.entries(obj.items || {})) await store.set('items/' + id, it);
  for (const [id, t] of Object.entries(obj.txns || {})) await store.set('txns/' + id, t);
}
function patchOv(key, patch) {
  return save(store.update('fin/marks', {ov: {[key]: Object.assign({skip: null, date: null, amt: null}, MARKS.ov[key] || {}, patch)}}));
}
function setOv(key, val) {
  return save(store.update('fin/marks', {ov: {[key]: val ? Object.assign({skip: null, date: null, amt: null}, val) : {skip: null, date: null, amt: null}}}));
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['var(--gold)', 'var(--lime)', 'var(--coral)', 'var(--coin)'];
  for (let i = 0; i < 46; i++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + '%'; s.style.background = cols[i % 4]; s.style.animationDelay = (Math.random() * .5) + 's'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2400);
}
function toast(msg, kind = '') {
  if (headless) return;
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.innerHTML = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), kind === 'big' ? 3200 : 2400);
  setTimeout(() => el.remove(), kind === 'big' ? 3600 : 2800);
}

const FORMS = {
  hydrafrom(f, fd) {
    const acct = fd.get('acct'), group = f.dataset.group, heads = ITEMS.filter(i => i.group === group && !i.income);
    save(Promise.all(heads.map(i => store.update('items/' + i.id, {acct}))), `${heads.length} ${esc(group)} plans now paid from ${esc(acctName(acct))}`).then(closeSheet);
  },
  async live(f, fd) {
    const er = m => { const e = $('#lv-err'); if (e) { e.textContent = m; e.hidden = false; } };
    const url = String(fd.get('url') || '').trim().replace(/\/+$/, ''), key = String(fd.get('key') || '').trim();
    if (!/^https:\/\/|^http:\/\/localhost(:\d+)?$/.test(url)) return er('Paste the https:// address of your sync service.');
    if (key) { try { localStorage.setItem(LIVE_KEY, key); } catch (e) { return er("This browser won't keep the key."); } }
    if (!liveKey()) return er('Type the app key you chose.');
    try { const r = await fetch(url + '/v1/health'); if (!r.ok) throw new Error(); } catch (e) { return er("Can't reach that address. Check it and your internet."); }
    const map = {};
    for (const [k, v] of fd.entries()) if (k.startsWith('lm_')) map[k.slice(3)] = v;
    const first = !(S.live && S.live.url);
    const mapPatch = Object.assign({}, (S.live || {}).map || {}, map);
    await save(store.update('fin/settings', {live: {url, map: mapPatch, since: (S.live && S.live.since) || T}}));
    const btn = f.querySelector('button.gold'); if (btn) { btn.disabled = true; btn.textContent = first ? 'Connecting…' : 'Syncing…'; }
    const r = await liveSync(true);
    if (!r) { if (btn) { btn.disabled = false; btn.textContent = 'Try again'; } return er(`Sync failed: ${liveErr}`); }
    closeSheet(); liveToast(r);
    if (first) setTimeout(() => { openSettings(); const b = $('#lv-url'); if (b) b.scrollIntoView({block: 'center'}); }, 400);
  },
  setup(f) {
    setupRead(f);
    const s = SETUP, st = s.step;
    if (st === 1 && (isNaN(num(s.buffer)) || isNaN(num(s.living)))) return fail('Check the two amounts.');
    if (st === 2) {
      if (!s.accounts.some(a => a.name.trim())) return fail('Name at least one account.');
      if (s.accounts.some(a => a.name.trim() && String(a.bal).trim() !== '' && isNaN(num(a.bal)))) return fail('Check the balances.');
    }
    if (st === 3 && !s.pay.none && String(s.pay.amt).trim() !== '' && !(num(s.pay.amt) > 0)) return fail('Check the amount, or tick the box below.');
    if (st === 4 && s.bills.some(b => String(b.amt).trim() !== '' && !(num(b.amt) > 0))) return fail('Check the amounts.');
    if (st < 4) return openSetup(st + 1);
    const {settings, items} = setupBoard();
    SETUP = null; closeSheet();
    save(importAll({settings, items}), `Your board is ready${settings.name ? ', ' + esc(settings.name) : ''}`).then(() => go('hq'));
  },
  async push(f, fd) {
    const prefs = {money: fd.get('money') === 'on', bills: fd.get('bills') === 'on', sync: fd.get('sync') === 'on', game: fd.get('game') === 'on'}, btn = f.querySelector('button.gold'), was = !!pushConf();
    const er = m => { const e = $('#pn-err'); if (e) { e.textContent = m; e.hidden = false; } };
    btn.disabled = true; btn.textContent = was ? 'Saving…' : 'Turning on…';
    try { await pushOn(prefs); closeSheet(); toast(was ? 'Saved' : 'Notifications are on. Send a test from Settings to see one.'); }
    catch (e) {
      btn.disabled = false; btn.textContent = was ? 'Save' : 'Turn on notifications'; er(e.message || String(e));
      const standalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
      cloudFetch('/v1/push/report', {method: 'POST', body: {error: String(e.message || e).slice(0, 300), permission: typeof Notification !== 'undefined' ? Notification.permission : 'none', standalone, version: BUILD, device: device().label}}).catch(() => {});
    }
  },
  async cloud(f, fd) {
    const er = m => { const e = $('#cb-err'); if (e) { e.textContent = m; e.hidden = false; } };
    const pass = String(fd.get('pass') || ''), btn = f.querySelector('button.gold');
    if (pass.length < 10) return er('Use at least 10 characters.');
    if (pass !== String(fd.get('pass2') || '')) return er("The two passphrases don't match.");

    try {
      const r = await cloudFetch('/v1/backup');
      if (r.status === 200) {

        const kc = await keyForEnvelope(pass, r.body.blob);
        await unseal(r.body.blob, kc);
        writeJSON(CLOUD_KEY, {k: kc.k, salt: kc.salt, iter: kc.iter, last: null});
        closeSheet();
        if (!ITEMS.length && !TXNS.length) await cloudLoad(r.body, false, r.body.blob); else openCloudConflict(r.body);
        return;
      }
      if (r.status !== 404) throw fail$(r);
      writeJSON(CLOUD_KEY, Object.assign(await newLockKey(pass), {last: null}));
      if (!(await cloudUpload(true))) { const m = cloudErr || 'the upload failed'; writeJSON(CLOUD_KEY, null); throw new Error(m); }
      closeSheet(); scheduleRender(); toast('Cloud backup is on');
    } catch (e) { btn.disabled = false; btn.textContent = 'Turn on cloud backup'; er(e.message || String(e)); }
  },
  async cloudrestore(f, fd) {
    const er = m => { const e = $('#cr-err'); if (e) { e.textContent = m; e.hidden = false; } };
    const url = String(fd.get('url') || '').trim().replace(/\/+$/, ''), key = String(fd.get('key') || '').trim(), pass = String(fd.get('pass') || ''), btn = f.querySelector('button.gold');
    if (!/^https:\/\/|^http:\/\/localhost(:\d+)?$/.test(url)) return er('Paste the https:// address of your sync service.');
    if (!key || !pass) return er('Type the app key and your backup passphrase.');
    btn.disabled = true; btn.textContent = 'Unlocking…';
    try {
      const r = await cloudFetch('/v1/backup', {url, key});
      if (r.status === 404) throw new Error('There is no cloud backup on that sync service yet. Turn it on in Settings on the device that has your board.');
      if (r.status !== 200) throw fail$(r);
      const kc = await keyForEnvelope(pass, r.body.blob), board = await unseal(r.body.blob, kc);
      if (!board.docs || !board.docs['fin/settings']) throw new Error('That backup has no board in it.');
      try { localStorage.setItem(LIVE_KEY, key); } catch (e) { throw new Error("This browser won't keep the key."); }
      writeJSON(CLOUD_KEY, {k: kc.k, salt: kc.salt, iter: kc.iter, last: {id: r.body.id, at: Date.now(), hash: await boardHash(board.docs), from: r.body.label}});
      cloudLoading = true;
      try { store.load(board.docs); } finally { cloudLoading = false; }
      cloudTried = true;
      closeSheet(); toast(`Your board is here, from your ${esc(r.body.label || 'other device')} (saved ${esc(agoIso(r.body.created_at))})`);
    } catch (e) { btn.disabled = false; btn.textContent = 'Restore my board'; er(e.message || String(e)); }
  },
  search() { const i = $('#q-search'); if (i) i.blur(); },
  spend(f, fd) {
    const amt = num(fd.get('amt')); if (!(amt > 0)) return fail('Type how much you spent.');
    const date = fd.get('date') || T;
    save(store.add('txns', {kind: 'exp', date, eur: r2(amt), orig: r2(amt), cur: 'EUR', acct: fd.get('acct'), cat: fd.get('cat'), note: (fd.get('note') || '').trim(), at: Date.now()})).then(() => {
